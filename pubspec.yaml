name: clickout
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Payment Gateways
  razorpay_flutter: ^1.3.6
  phonepe_payment_sdk: ^2.0.3  # 🚀 PhonePe ka official Flutter SDK
  crypto: ^3.0.3               # 🔒 Checksum (SHA256) banane ke liye
  
  # 🔥 Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6

  # Utils
  shared_preferences: ^2.2.2
  path_provider: ^2.1.5
  provider: ^6.1.2
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  vibration: ^3.1.6 

  # Scanner & Generator
  mobile_scanner: ^7.1.4 
  qr_flutter: ^4.1.0

  # Sound
  audioplayers: ^6.0.0

  # PDF
  pdf: ^3.11.3
  printing: ^5.13.1

  # UI
  cupertino_icons: ^1.0.6
  image_picker: ^1.0.7
  flutter_native_splash: ^2.4.7
  geolocator: ^14.0.2

  # Sms
  sms_autofill: ^2.4.0
  flutter_local_notifications: ^20.1.0
  firebase_messaging: ^16.1.1

  #Web  
  universal_html: ^2.3.0  

  google_fonts: ^4.0.3
  dots_indicator: ^2.0.0
  http: ^1.6.0
  cloud_functions: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/logo.png
    - assets/icons/gpay.png
    - assets/icons/phonepe.png
    - assets/icons/paytm.png
    - assets/icons/upi.png
    # - assets/sounds/delete.mp3  # Isko uncomment karna jab file daal do
